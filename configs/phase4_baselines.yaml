experiment_name: phase4_unet3d_baseline
phase: 4
model:
  type: unet3d
  in_channels: 4
  num_classes: 3
  base_channels: 32
  depth: 4

data:
  data_dir: data/processed/BraTS
  manifest: data/processed/BraTS/split_manifest.json
  patch_size: [128, 128, 128]
  mutually_exclusive: false

train:
  batch_size: 2
  num_workers: 8
  epochs: 300
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-5
  lr_schedule: cosine
  warmup_epochs: 10
  loss:
    type: dice_bce
    dice_weight: 1.0
    bce_weight: 1.0
  val_interval: 5
  amp: true
  grad_clip_norm: 1.0
  checkpoint_dir: checkpoints/phase4_unet3d
  log_dir: logs/phase4_unet3d

eval:
  sliding_window: true
  sw_overlap: 0.5
  threshold: 0.5

# NOTE: SegDINO is NOT trainable via this config -- it's a 2D method with its own
# repo/pipeline (github.com/script-Yang/SegDINO). See
# scripts/segdino_2p5d_adapter_notes.md for how to slot it into this comparison
# table as a 2.5D baseline instead of trying to force it through this 3D trainer.
