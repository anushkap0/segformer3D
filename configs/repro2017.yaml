experiment_name: repro2017
phase: 1
model:
  type: segformer3d_official
  official_repo_dir: /workspace/official_src_clone
  in_channels: 4
  num_classes: 3
  embed_dims:
  - 32
  - 64
  - 160
  - 256
  num_heads:
  - 1
  - 2
  - 5
  - 8
  sr_ratios:
  - 4
  - 2
  - 1
  - 1
  depths:
  - 2
  - 2
  - 2
  - 2
  mlp_ratios:
  - 4
  - 4
  - 4
  - 4
  patch_kernel_size:
  - 7
  - 3
  - 3
  - 3
  patch_stride:
  - 4
  - 2
  - 2
  - 2
  patch_padding:
  - 3
  - 1
  - 1
  - 1
  decoder_head_embedding_dim: 256
  decoder_dropout: 0.0
data:
  data_dir: data/processed/BraTS2017_repro
  manifest: data/processed/BraTS2017_repro/split_manifest.json
  patch_size:
  - 128
  - 128
  - 128
  mutually_exclusive: false
train:
  batch_size: 2
  num_workers: 4
  epochs: 800
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.01
  lr_schedule: cosine_wr
  warmup_epochs: 20
  loss:
    type: dice_bce
    dice_weight: 1.0
    bce_weight: 0.0
  val_interval: 5
  amp: true
  grad_clip_norm: 1000.0
  checkpoint_dir: checkpoints/repro2017
  log_dir: logs/repro2017
  t0_epochs: 400
  min_lr: 6.0e-06
  seed: 42
eval:
  sliding_window: true
  sw_overlap: 0.5
  threshold: 0.5
