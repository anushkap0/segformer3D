experiment_name: phase4_unet3d_baseline
phase: 4
model:
  type: unet3d
  in_channels: 4
  num_classes: 3
  base_channels: 32
  depth: 4
data:
  data_dir: data/processed/BraTS2017ext
  manifest: data/processed/BraTS2017ext/split_manifest.json
  patch_size:
  - 128
  - 128
  - 128
  mutually_exclusive: false
train:
  batch_size: 4
  num_workers: 4
  epochs: 200
  optimizer: adamw
  lr: 0.0003
  weight_decay: 1.0e-05
  lr_schedule: cosine
  warmup_epochs: 10
  loss:
    type: dice_bce
    dice_weight: 1.0
    bce_weight: 1.0
  val_interval: 5
  amp: true
  grad_clip_norm: 1.0
  checkpoint_dir: checkpoints/phase4_unet3d
  log_dir: logs/phase4_unet3d
eval:
  sliding_window: true
  sw_overlap: 0.5
  threshold: 0.5
