experiment_name: phase1_baseline
phase: 1
model:
  type: segformer3d
  in_channels: 4
  num_classes: 3
  embed_dims:
  - 32
  - 64
  - 160
  - 256
  num_heads:
  - 1
  - 2
  - 5
  - 8
  sr_ratios:
  - 8
  - 4
  - 2
  - 1
  depths:
  - 2
  - 2
  - 2
  - 2
  decoder_dim: 128
  drop_path_rate: 0.1
data:
  data_dir: data/processed/BraTS2021_FULL
  manifest: data/processed/BraTS2021_FULL/split_manifest.json
  patch_size:
  - 128
  - 128
  - 128
  mutually_exclusive: false
train:
  batch_size: 4
  num_workers: 8
  epochs: 5
  optimizer: adamw
  lr: 0.0003
  weight_decay: 1.0e-05
  lr_schedule: cosine
  warmup_epochs: 10
  loss:
    type: dice_bce
    dice_weight: 1.0
    bce_weight: 1.0
  val_interval: 5
  amp: true
  grad_clip_norm: 1.0
  checkpoint_dir: checkpoints/phase1_timing5
  log_dir: logs/phase1_timing5
eval:
  sliding_window: true
  sw_overlap: 0.5
  threshold: 0.5
